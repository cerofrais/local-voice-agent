[project]
name = "local-voice-agent"
version = "0.1.0"
description = "Fully local voice agent for support and sales qualification, wired to a self-hosted CRM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "onnxruntime-gpu[cuda,cudnn]>=1.31.0",
    "pipecat-ai[kokoro,local-smart-turn-v3,openai,runner,silero,webrtc,whisper]>=1.13.0",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
eval = [
    "jiwer>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# kokoro-onnx and pipecat depend on plain onnxruntime; use the CUDA build instead (same module name).
exclude-dependencies = ["onnxruntime"]
